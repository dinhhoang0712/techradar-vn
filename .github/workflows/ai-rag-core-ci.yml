name: AI RAG Core CI

# tests/conftest.py mocks Neo4j/Postgres/the Gemini LLM entirely (mock_env_vars/mock_db/
# mock_neo4j_session/mock_llm fixtures) — no service containers needed, just the dependencies
# importable.
on:
  push:
    branches: [master]
    paths:
      - "services/ai-rag-core/**"
      - ".github/workflows/ai-rag-core-ci.yml"
  pull_request:
    paths:
      - "services/ai-rag-core/**"
      - ".github/workflows/ai-rag-core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # requirements.txt has `-e ../llm-gateway[all]` — pip resolves that relative path against the
    # CWD of the pip invocation, NOT against requirements.txt's own directory. Every `run:` step
    # below must execute with services/ai-rag-core as CWD or that line resolves to a nonexistent
    # path one level above the repo root and fails with "not a valid editable requirement".
    defaults:
      run:
        working-directory: services/ai-rag-core
    steps:
      - uses: actions/checkout@v4

      # Matches services/ai-rag-core/Dockerfile's base image (python:3.11-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-rag-core/requirements.txt

      # CPU-only torch FIRST — sentence-transformers/transformers below pull torch transitively,
      # and without this index pip defaults to the CUDA wheel (~5x larger download) even though
      # CI never touches a GPU. Same pattern as the service's own Dockerfile.
      - name: Install torch (CPU-only)
        run: pip install --timeout 600 torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests
