[project]
name = "llm-gateway"
version = "0.1.0"
description = "Gateway LLM đa provider dùng chung cho các service Python trong monorepo: fallback, rate limit theo token, tính cost."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40.0,<2.0.0"]
groq = ["groq>=0.9.0,<1.0.0"]
gemini = ["google-generativeai>=0.7.0,<1.0.0"]
claude = ["anthropic>=0.40.0,<1.0.0"]
redis = ["redis>=5.0.0,<6.0.0"]
all = [
    "openai>=1.40.0,<2.0.0",
    "groq>=0.9.0,<1.0.0",
    "google-generativeai>=0.7.0,<1.0.0",
    "anthropic>=0.40.0,<1.0.0",
    "redis>=5.0.0,<6.0.0",
]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
