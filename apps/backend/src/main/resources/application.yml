spring:
  application:
    name: tech-radar-api

  profiles:
    active: ${APP_ENV:dev}

  # Match the snake_case contract used by the web/mobile clients and the Python services.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  codec:
    max-in-memory-size: 20MB

  webflux:
    base-path: /api/v1
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:*}
      allowed-methods: GET, POST, PUT, DELETE, PATCH, OPTIONS
      allowed-headers: "*"
      max-age: 3600

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:techradar-group}
      auto-offset-reset: earliest
      enable-auto-commit: true
    producer:
      retries: 3

  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techradar}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    pool:
      initial-size: 10
      max-size: 20
      validation-query: SELECT 1

  # SMTP for password-reset emails. Dev defaults target MailHog (localhost:1025).
  # Sending is fire-and-forget, so an unavailable SMTP never breaks /auth/forgot-password.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 3000
          timeout: 3000
          writetimeout: 3000

  # Spring Boot 3.0+ moved these properties from spring.redis.* to spring.data.redis.*.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # Flyway runs migrations over a dedicated JDBC connection at startup.
  # The application itself talks to Postgres reactively via R2DBC above.
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:techradar}
    user: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-with-at-least-256-bits}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  python:
    # Shared secret sent as X-Internal-Auth to ai-rag-core (/chat, /internal/ai/*).
    # Must match ai-rag-core's INTERNAL_API_TOKEN. Empty = disabled (dev).
    internal-token: ${PYTHON_INTERNAL_TOKEN:}
    ai:
      base-url: ${PYTHON_AI_BASE_URL:http://localhost:8000}
      timeout: 60000
    rag:
      base-url: ${PYTHON_RAG_BASE_URL:http://localhost:8000}
      timeout: 120000
    clustering:
      base-url: ${PYTHON_ML_CLUSTERING_BASE_URL:http://localhost:8001}
      timeout: 60000

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:password}
    database: ${NEO4J_DATABASE:neo4j}
    pool-size: 50
    acquisition-timeout: 60000

  mail:
    from: ${MAIL_FROM:no-reply@techradar.vn}

  web:
    reset-url: ${WEB_RESET_URL:http://localhost:5173/login}

  redis:
    # TTLs (seconds) for each caching layer.
    token-blacklist-ttl: ${REDIS_TOKEN_BLACKLIST_TTL:604800}
    clustering-cache-ttl: ${REDIS_CLUSTERING_CACHE_TTL:900}
    radar-cache-ttl: ${REDIS_RADAR_CACHE_TTL:3600}
    company-cache-ttl: ${REDIS_COMPANY_CACHE_TTL:1800}
    job-cache-ttl: ${REDIS_JOB_CACHE_TTL:1800}
    roadmap-cache-ttl: ${REDIS_ROADMAP_CACHE_TTL:1800}
    public-stats-cache-ttl: ${REDIS_PUBLIC_STATS_CACHE_TTL:1800}
    chat-rate-limit:
      max-requests: ${CHAT_RATE_LIMIT_MAX:20}
      window-seconds: ${CHAT_RATE_LIMIT_WINDOW:60}
    aiproxy-rate-limit:
      max-requests: ${AIPROXY_RATE_LIMIT_MAX:20}
      window-seconds: ${AIPROXY_RATE_LIMIT_WINDOW:60}
    auth-rate-limit:
      login:
        max-requests: ${AUTH_LOGIN_RATE_LIMIT_MAX:10}
        window-seconds: ${AUTH_LOGIN_RATE_LIMIT_WINDOW:60}
      register:
        max-requests: ${AUTH_REGISTER_RATE_LIMIT_MAX:5}
        window-seconds: ${AUTH_REGISTER_RATE_LIMIT_WINDOW:60}
      forgot-password:
        max-requests: ${AUTH_FORGOT_PASSWORD_RATE_LIMIT_MAX:5}
        window-seconds: ${AUTH_FORGOT_PASSWORD_RATE_LIMIT_WINDOW:300}

  analytics:
    etl:
      # Periodic rebuild of tech_analytics from Neo4j. Off by default; trigger manually via
      # POST /api/v1/admin/analytics/rebuild, or set enabled=true to schedule it.
      enabled: ${ANALYTICS_ETL_ENABLED:false}
      cron: ${ANALYTICS_ETL_CRON:0 0 3 * * *}

  report:
    monthly:
      # Generates last month's technology trend report via the ai-rag-core /report LLM call and
      # catalogs it in the admin CMS (cms_content, type=Report, status=Pending for admin review).
      # Off by default (real LLM cost each run) — set enabled=true to schedule it.
      enabled: ${REPORT_MONTHLY_ENABLED:false}
      cron: ${REPORT_MONTHLY_CRON:0 0 5 1 * *}

  notifications:
    # Min month-over-month growth (%) for a technology to raise a trend alert during the ETL.
    # Each alert is published to Kafka (trend.alerts) and fanned out to subscribed users. Also
    # reused by the roadmap alert scan below as the "hot skill" threshold.
    trend-threshold: ${NOTIF_TREND_THRESHOLD:30}
    # Timeout for the /summarize AI call TrendAlertDispatcher makes to enrich the notification
    # body with a grounded narrative. Kept below AiProxyPort.DEFAULT_TIMEOUT (60s) so a slow/hung
    # call can't block the Kafka consumer thread for a full minute per alert.
    trend-summarize-timeout-ms: ${NOTIF_TREND_SUMMARIZE_TIMEOUT_MS:30000}

  roadmap:
    alert:
      # Weekly scan: recompute each user's career roadmap and, if their #1 recommended next skill
      # is growing at least app.notifications.trend-threshold%, publish a roadmap.alerts event.
      # Off by default (each run triggers 2 LLM calls per candidate user).
      enabled: ${ROADMAP_ALERT_ENABLED:false}
      cron: ${ROADMAP_ALERT_CRON:0 0 4 * * MON}

# Circuit breakers around Python service calls (ai-rag-core / ml-clustering) — see
# docs/adr/0007-circuit-breaker-for-python-service-calls.md. One instance per downstream service
# (not per client class) so e.g. ai-rag-core being down trips the SAME breaker for every one of
# its 4 clients (Chat/AiClient/AiProxyClient/ModerationClient), reflecting its real health.
resilience4j:
  circuitbreaker:
    instances:
      aiRagCore:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
      mlClustering:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true

# Log appenders/patterns live in logback-spring.xml (console for dev, JSON+file for prod).
# Only levels are configured here; LOG_DIR (file output dir) is read by logback-spring.xml.
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.techpulse: DEBUG

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: tech-radar-api
