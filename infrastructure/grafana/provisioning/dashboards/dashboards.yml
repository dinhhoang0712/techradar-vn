apiVersion: 1

# Auto-loads every *.json dashboard placed under this same directory on Grafana startup.
providers:
  - name: TechRadar
    orgId: 1
    folder: TechRadar
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
