name: Backend CI

# Postgres/Neo4j/Redis are spun up as service containers with the same images and credentials as
# docker-compose.yml, so IntegrationTestSupport's @EnabledIfEnvironmentVariable(POSTGRES_HOST) gate
# opens and the full suite (unit + integration) runs on every PR, not just the unit subset.
on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techradar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/backend/pom.xml

      # Neo4j has no built-in `--health-cmd` equivalent to postgres/redis above, so poll its HTTP
      # endpoint until it answers instead of racing the JVM startup against Neo4j's own boot time.
      - name: Wait for Neo4j
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7474 > /dev/null && exit 0
            sleep 2
          done
          echo "Neo4j did not become ready in time" >&2
          exit 1

      - name: Run tests
        working-directory: apps/backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: techradar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_SECRET: ci-only-test-secret-do-not-use-in-prod-0123456789
        run: mvn -B test

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/backend/target/surefire-reports
