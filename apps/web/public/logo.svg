<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f9dff"/>
      <stop offset="100%" stop-color="#9b8cff"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- radar dial -->
  <circle cx="30" cy="36" r="22" fill="none" stroke="#6b74a0" stroke-width="3" opacity="0.5"/>

  <!-- resting sweep -->
  <path d="M30,36 L26.18,14.33 A22,22 0 0,1 35.69,14.75 Z" fill="url(#grad)" opacity="0.16"/>
  <line x1="30" y1="36" x2="35.69" y2="14.75" stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="35.69" cy="14.75" r="2" fill="#f4f7ff"/>

  <!-- breakout trend line -->
  <g filter="url(#softGlow)">
    <path d="M16,46 L30,36 L44,22 L54,10" fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="10" r="7" fill="none" stroke="#bdb2ff" stroke-width="1.2" opacity="0.35"/>
    <circle cx="16" cy="46" r="2.8" fill="#4f9dff"/>
    <circle cx="30" cy="36" r="3.2" fill="#82c0ff"/>
    <circle cx="44" cy="22" r="3.8" fill="#bdb2ff"/>
    <circle cx="54" cy="10" r="9" fill="#9b8cff" opacity="0.32"/>
    <circle cx="54" cy="10" r="5" fill="#f4f7ff"/>
  </g>
</svg>
